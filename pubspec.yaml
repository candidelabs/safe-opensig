name: safe_opensig
description: "Second factor verification for Safe transactions"
publish_to: 'none'
version: 1.1.4+9

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # UI
  animations: 2.1.1
  cupertino_icons: 1.0.8
  cupertino_tabbar: 2.0.0
  flutter_svg: 2.2.3
  wolt_modal_sheet: 0.11.0
  toastification: 3.0.3
  keyboard_actions: 4.2.1
  bot_toast: 4.1.3
  smooth_page_indicator: 1.2.1
  dotted_line: 3.2.3
  blockies: 0.1.2
  # Navigation
  go_router: 16.1.0
  event_bus: 2.0.1
  # Storage
  hive_ce: 2.16.0
  hive_ce_flutter: 2.3.4
  # EVM
  web3dart: 3.0.1
  wallet: 0.0.18
  # Other
  http: 1.6.0
  dio: 5.9.0
  mobile_scanner: 7.1.4
  uuid: 4.5.2
  equatable: 2.0.8
  permission_handler: 12.0.1
  version: 3.0.2
  flutter_dotenv: 6.0.0
  hex: 0.2.0
  package_info_plus: 8.3.1
  path_provider: 2.1.5
  aptabase_flutter: 0.4.1
  # Rust Bridge
  revm_tracer:
    git:
      url: https://github.com/candidelabs/revm-tracer
      ref: e454043b8f1ff2251884fef9e1cf1510f1f438f1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  window_manager: ^0.5.1
  hive_ce_generator: ^1.9.3
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/networks/
    - assets/hardware_wallets/
    - assets/images/guides/
