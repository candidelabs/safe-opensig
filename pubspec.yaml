name: safe_verify
description: "Second factor verification for Safe transactions"
publish_to: 'none'
version: 0.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^3.0.0-dev.17
  riverpod_annotation: ^3.0.0-dev.17
  # UI
  animations: ^2.0.11
  cupertino_icons: ^1.0.8
  cupertino_tabbar: ^2.0.0
  flutter_svg: ^2.2.0
  wolt_modal_sheet: ^0.11.0
  toastification: ^3.0.3
  keyboard_actions: ^4.2.0
  bot_toast: ^4.1.3
  smooth_page_indicator: ^1.2.1
  # Navigation
  go_router: ^16.1.0
  event_bus: ^2.0.1
  # Storage
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  # EVM
  web3dart: ^3.0.1
  wallet: ^0.0.18
  # Other
  http: ^1.5.0
  dio: ^5.8.0+1
  mobile_scanner: ^7.0.1
  uuid: ^4.5.1
  equatable: ^2.0.7
  permission_handler: ^12.0.1
  version: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0-dev.17
  riverpod_generator: ^3.0.0-dev.17
  window_manager: ^0.5.1
  hive_ce_generator: ^1.9.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/networks/
    - assets/hardware_wallets/
